[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-assurance-doc-scanner"
version = "0.4.0"
description = "AI-assisted scanner for long-horizon time assurance issues in standards and technical documentation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "John Lange" }]
# License deferred until first public visibility.
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.0",
  "python-docx>=1.1",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tads = "tads.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.tads]
# Package defaults; runtime config may override.
default_privacy_mode = "ephemeral"
